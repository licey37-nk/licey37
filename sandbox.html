    <span class="lbl">Шаблоны:</span>

  <div class="sb-main">

      <button type="button" class="sb-btn run" id="sb-run">▶️ Запустить</button>

      <button type="button" class="sb-sym" data-sym=")">)</button>

      <button type="button" class="sb-sym" data-sym="]">]</button>
      <button type="button" class="sb-sym" data-sym=";">;</button>

      <button type="button" class="sb-sym" data-sym="<=">&lt;=</button>
      <button type="button" class="sb-sym" data-sym=">=">&gt;=</button>
      <button type="button" class="sb-sym" data-sym="<<">&lt;&lt;</button>
      <button type="button" class="sb-sym" data-sym=">>">&gt;&gt;</button>

      <div class="sb-term-head">
        <span class="sb-status" id="sb-status">● Готово</span>

  <div class="sb-modal" id="sb-progs-modal">
    <div class="sb-modal-card">
      <div class="sb-modal-head">📂 Мои программы<button type="button" class="sb-mini" id="sb-progs-close">✕</button></div>
      <div class="sb-save-row">
        <input id="sb-prog-name" placeholder="Название программы (например, Домашка)" maxlength="60">
        <button type="button" class="sb-btn init" id="sb-prog-save">💾 Сохранить</button>
      </div>
      <div id="sb-prog-list"></div>
    </div>
  </div>

<script>
  /* ============================================================
     КОД-ПЕСОЧНИЦА ЛИЦЕИСТА · МБОУ «Лицей №37»
     ЖЕЛЕЗНОЕ ПРАВИЛО: файл полностью автономен — никаких ключей
     Supabase, никаких обращений к базе site_content и профилям.
     Единственные внешние вызовы: Pyodide (CDN) и Piston API (C++).
     ============================================================ */
  (function () {
    'use strict';

    var TEMPLATES = {
      python: [
        { name: 'Квадратное уравнение', code:
'# Квадратное уравнение: a*x^2 + b*x + c = 0\nimport math\n\nprint("Решение квадратного уравнения ax^2 + bx + c = 0")\na = float(input("Введи a: ") or 1)\nb = float(input("Введи b: ") or -3)\nc = float(input("Введи c: ") or 2)\n\nif a == 0:\n    print("Это не квадратное уравнение: a = 0")\nelse:\n    d = b * b - 4 * a * c\n    print("Дискриминант D =", d)\n    if d > 0:\n        x1 = (-b + math.sqrt(d)) / (2 * a)\n        x2 = (-b - math.sqrt(d)) / (2 * a)\n        print("Два корня: x1 =", round(x1, 3), " x2 =", round(x2, 3))\n    elif d == 0:\n        print("Один корень: x =", round(-b / (2 * a), 3))\n    else:\n        print("Действительных корней нет (D < 0)")\n' },
        { name: 'Списки и строки', code:
'# Обработка списков и строк\nnums = [12, 5, 8, 21, 4, 17, 9, 30, 2]\nprint("Список:", nums)\nprint("Сумма:", sum(nums))\nprint("Максимум:", max(nums), " Минимум:", min(nums))\nprint("Отсортированный:", sorted(nums))\nprint("Чётные:", [n for n in nums if n % 2 == 0])\n\nphrase = "Лицей номер 37 город Нижнекамск"\nwords = phrase.split()\nprint("\\nФраза:", phrase)\nprint("Слов:", len(words))\nprint("Длина самого длинного слова:", len(max(words, key=len)))\nprint("Перевёрнутая:", phrase[::-1])\nprint("Заглавные первые буквы:", " ".join(w.capitalize() for w in words))\n' },
        { name: 'Типовая задача ЕГЭ', code:
'# Типовая задача ЕГЭ (информатика)\n# В файле строка: сначала N — количество чисел, затем сами числа.\n# Найти количество чисел, кратных 4, и максимальное из них.\ndata = "8\\n12\\n7\\n4\\n36\\n9\\n16\\n5\\n20"\n\nlines = data.split()\nn = int(lines[0])\nnums = [int(lines[i]) for i in range(1, n + 1)]\n\ncount4 = 0\nbest = None\nfor x in nums:\n    if x % 4 == 0:\n        count4 += 1\n        if best is None or x > best:\n            best = x\n\nprint("Всего чисел:", n)\nprint("Чисел, кратных 4:", count4)\nprint("Максимальное из них:", best)\n' }
      ],
      cpp: [
        { name: 'Олимпиадная задача', code:
'// Олимпиадный шаблон: C++17\n// Считать N чисел, отсортировать, вывести сумму и медиану.\n#include <iostream>\n#include <vector>\n#include <algorithm>\n\nint main() {\n    std::ios_base::sync_with_stdio(false);\n    std::cin.tie(nullptr);\n\n    int n;\n    std::cin >> n;\n    std::vector<long long> a(n);\n    for (int i = 0; i < n; ++i) std::cin >> a[i];\n\n    std::sort(a.begin(), a.end());\n\n    long long sum = 0;\n    for (long long x : a) sum += x;\n\n    long long median = a[n / 2];\n\n    std::cout << "Сумма: " << sum << "\\n";\n    std::cout << "Медиана: " << median << "\\n";\n    std::cout << "Минимум: " << a.front() << ", максимум: " << a.back() << "\\n";\n    return 0;\n}\n' },
        { name: 'Ввод-вывод и циклы', code:
'// Тренировка ввода-вывода и циклов\n#include <iostream>\n\nint main() {\n    int n;\n    std::cin >> n;\n    long long fact = 1;\n    for (int i = 2; i <= n; ++i) fact *= i;\n    std::cout << n << "! = " << fact << "\\n";\n\n    for (int i = 1; i <= 5; ++i) {\n        for (int j = 0; j < i; ++j) std::cout << "*";\n        std::cout << "\\n";\n    }\n    return 0;\n}\n' },
        { name: 'Строки и map', code:
'// Частотный анализ символов строки\n#include <iostream>\n#include <string>\n#include <map>\n\nint main() {\n    std::string s;\n    std::getline(std::cin, s);\n\n    std::map<char, int> freq;\n    for (char c : s) {\n        if (c != \' \') freq[std::tolower(c)]++;\n    }\n\n    for (auto& p : freq) {\n        std::cout << p.first << " -> " << p.second << "\\n";\n    }\n    return 0;\n}\n' }
      ],
      js: [
        { name: 'console.log и методы массивов', code:
'// Методы массивов ES2023\nconst nums = [12, 5, 8, 21, 4, 17, 9, 30, 2];\nconsole.log("Исходный:", nums);\nconsole.log("Сумма:", nums.reduce((s, n) => s + n, 0));\nconsole.log("Отсортированный:", [...nums].sort((a, b) => a - b));\nconsole.log("Чётные:", nums.filter(n => n % 2 === 0));\nconsole.log("Последний:", nums.at(-1));\nconsole.log("Найден 21?", nums.find(n => n === 21));\n' },
        { name: 'Строки и шаблонные литералы', code:
'// Строки и шаблонные литералы\nconst name = "Лицей №37";\nconst city = "Нижнекамск";\nconst year = 2026;\n\nconsole.log(`${name}, ${city}, ${year} год`);\nconsole.log("Длина:", name.length);\nconsole.log("ВЕРХНИЙ регистр:", name.toUpperCase());\nconsole.log("Содержит 37:", name.includes("37"));\nconsole.log("Повтор:", "⚡".repeat(5));\n' },
        { name: 'Алгоритм: поиск пары с суммой', code:
'// Классическая задача: найти пару чисел с заданной суммой\nfunction findPair(arr, target) {\n  const seen = new Map();\n  for (let i = 0; i < arr.length; i++) {\n    const need = target - arr[i];\n    if (seen.has(need)) return [seen.get(need), i];\n    seen.set(arr[i], i);\n  }\n  return null;\n}\n\nconst arr = [2, 7, 11, 15, 3, 6];\nconsole.log("Массив:", arr);\nconsole.log("Пара с суммой 9:", findPair(arr, 9));\nconsole.log("Пара с суммой 18:", findPair(arr, 18));\nconsole.log("Пара с суммой 100:", findPair(arr, 100));\n' }
      ]
    };

    var state = { lang: 'python', tmpl: 0, pyodide: null, pyLoading: false };
    var $ = function (id) { return document.getElementById(id); };
    var codeEl = $('sb-code'), gutter = $('sb-gutter'), term = $('sb-term');
    var FILE_NAMES = { python: 'main.py', cpp: 'main.cpp', js: 'script.js' };
    var statusEl = $('sb-status');
    function setStatus37(kind, text) {
      if (!statusEl) return;
      statusEl.className = 'sb-status' + (kind ? ' ' + kind : '');
      statusEl.textContent = text;
    }
    function syncFileBadge37() {
      var f = $('sb-file');
      if (f) f.textContent = FILE_NAMES[state.lang] || 'main.txt';
    }

    /* ==== 🌙/☀️ Переключатель темы (100% локально, localStorage) ==== */
    var THEME_KEY = 'l37_sandbox_theme';
    function applyTheme37(t) {
      var day = t === 'day';
      document.body.classList.toggle('sb-day', day);
      var btn = $('sb-theme');
      if (btn) { btn.textContent = day ? '☀️ День' : '🌙 Ночь'; btn.title = day ? 'Переключить на тёмную тему' : 'Переключить на светлую тему'; }
      try { localStorage.setItem(THEME_KEY, day ? 'day' : 'night'); } catch (e) {}
    }
    function toggleTheme37() {
      applyTheme37(document.body.classList.contains('sb-day') ? 'night' : 'day');
    }
    try { applyTheme37((localStorage.getItem(THEME_KEY) || 'night') === 'day' ? 'day' : 'night'); } catch (e) { applyTheme37('night'); }
    $('sb-theme').addEventListener('click', toggleTheme37);

    var PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
    var PISTON_URL = 'https://emkc.org/api/v2/piston/execute';

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function tline(kind, text) {
      var d = document.createElement('div');
      d.className = 'sb-line ' + kind;
      d.textContent = text;
      term.appendChild(d);
      term.scrollTop = term.scrollHeight;
    }
    function sysMsg(t) { tline('sys', t); }
    function errMsg(t) { tline('err', t); }
    function outMsg(t) { tline('out', t); }
    function okMsg(t) { tline('ok', t); }

    function updateGutter() {
      var n = codeEl.value.split('\n').length;
      var html = '';
      for (var i = 1; i <= n; i++) html += i + '\n';
      gutter.textContent = html;
      gutter.scrollTop = codeEl.scrollTop;
    }

    function applyTemplate() {
      codeEl.value = TEMPLATES[state.lang][state.tmpl].code;
      updateGutter();
      term.innerHTML = '';
      sysMsg('Загружен шаблон: ' + TEMPLATES[state.lang][state.tmpl].name + ' (' + ({ python: 'Python 3', cpp: 'C++17', js: 'JavaScript' })[state.lang] + ')');
      syncFileBadge37();
      syncPyBtn();
    }

    function syncPyBtn() {
      var b = $('sb-py-init');
      b.style.display = (state.lang === 'python' && !state.pyodide) ? '' : 'none';
      b.textContent = state.pyLoading ? '⏳ Python загружается...' : '⚙️ Инициализировать Python (~6 МБ)';
    }

    function setBusy(on) {
      $('sb-run').disabled = on;
      $('sb-run').textContent = on ? '⏳ Выполняется...' : '▶️ Запустить';
      if (on) setStatus37('busy', '● Выполняется…');
    }

    function loadPyodide37() {
      if (state.pyodide) return Promise.resolve(state.pyodide);
      if (state.pyLoading) return Promise.reject(new Error('Python уже загружается, подожди...'));
      state.pyLoading = true;
      syncPyBtn();
      sysMsg('⏳ Загружаю автономный Python (Pyodide ~6 МБ, только первый раз)...');
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = PYODIDE_URL;
        s.onload = function () {
          window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' }).then(function (py) {
            state.pyodide = py;
            state.pyLoading = false;
            syncPyBtn();
            okMsg('✅ Python 3 готов! Можно запускать код.');
            resolve(py);
          }).catch(reject);
        };
        s.onerror = function () {
          state.pyLoading = false;
          syncPyBtn();
          reject(new Error('Не удалось загрузить Pyodide — проверь интернет (нужен один раз).'));
        };
        document.head.appendChild(s);
      });
    }

    function runPython() {
      setBusy(true);
      loadPyodide37().then(function (py) {
        term.innerHTML = '';
        sysMsg('🐍 Python 3 · запускаю программу...');
        py.setStdout({ batched: function (s) { outMsg(s); } });
        py.setStderr({ batched: function (s) { errMsg(s); } });
        var promptLine = '';
        py.setStdin({ stdin: function () {
          if (!promptLine) { promptLine = window.prompt('Ввод для программы (input):') || ''; }
          var v = promptLine; promptLine = '';
          outMsg('> ' + v);
          return v;
        } });
        var t0 = performance.now();
        return py.runPythonAsync(codeEl.value).then(function () {
          okMsg('✅ Программа завершена за ' + (performance.now() - t0).toFixed(1) + ' мс');
          setStatus37('ok', '● Готово');
        });
      }).catch(function (e) {
        errMsg('❌ ' + (e && e.message ? e.message : String(e)));
        setStatus37('err', '● Ошибка');
      }).then(function () { setBusy(false); });
    }

    function runCpp() {
      setBusy(true);
      term.innerHTML = '';
      sysMsg('⚙️ C++17 · отправляю код в облачный компилятор Piston...');
      var t0 = performance.now();
      fetch(PISTON_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          language: 'c++',
          version: '10.2.0',
          files: [{ name: 'main.cpp', content: codeEl.value }],
          stdin: '',
          compile_timeout: 10000,
          run_timeout: 5000
        })
      }).then(function (r) {
        if (!r.ok) throw new Error('Piston API ответил: HTTP ' + r.status + ' (проверь интернет или попробуй позже)');
        return r.json();
      }).then(function (res) {
        var comp = res.compile || {};
        if (comp.code !== 0) {
          errMsg('❌ Ошибка компиляции C++:');
          outMsg((comp.stderr || 'неизвестная ошибка компилятора').trim());
        } else {
          var run = res.run || {};
          if (run.stdout) outMsg(String(run.stdout).replace(/\n$/, ''));
          if (run.stderr) errMsg(String(run.stderr).trim());
          okMsg('✅ Программа завершена (код выхода ' + (run.code === undefined ? 0 : run.code) + ') за ' + (performance.now() - t0).toFixed(0) + ' мс, включая компиляцию в облаке');
          setStatus37('ok', '● Готово');
        }
      }).catch(function (e) {
        errMsg('❌ ' + (e && e.message ? e.message : String(e)));
        setStatus37('err', '● Ошибка');
      }).then(function () { setBusy(false); });
    }

    function runJs() {
      setBusy(true);
      term.innerHTML = '';
      sysMsg('⚡ JavaScript ES2023 · мгновенный запуск в песочнице...');
      var t0 = performance.now();
      var logs = [];
      var fakeConsole = {
        log: function () { logs.push(['out', Array.prototype.map.call(arguments, function (a) {
          return typeof a === 'object' ? JSON.stringify(a) : String(a);
        }).join(' ')]); },
        error: function () { logs.push(['err', Array.prototype.map.call(arguments, String).join(' ')]); },
        warn: function () { logs.push(['err', Array.prototype.map.call(arguments, String).join(' ')]); },
        info: function () { logs.push(['out', Array.prototype.map.call(arguments, String).join(' ')]); }
      };
      try {
        var fn = new Function('console', codeEl.value);
        fn(fakeConsole);
        logs.forEach(function (p) { (p[0] === 'err' ? errMsg : outMsg)(p[1]); });
        okMsg('✅ Программа завершена за ' + (performance.now() - t0).toFixed(1) + ' мс');
        setStatus37('ok', '● Готово');
      } catch (e) {
        logs.forEach(function (p) { (p[0] === 'err' ? errMsg : outMsg)(p[1]); });
        errMsg('❌ Ошибка выполнения: ' + (e && e.message ? e.message : String(e)));
        setStatus37('err', '● Ошибка');
      }
      setBusy(false);
    }

    function run() {
      if (state.lang === 'python') return runPython();
      if (state.lang === 'cpp') return runCpp();
      return runJs();
    }

    $('sb-run').addEventListener('click', run);
    $('sb-py-init').addEventListener('click', function () { loadPyodide37().catch(function (e) { errMsg('❌ ' + e.message); }); });
    $('sb-clear').addEventListener('click', function () { codeEl.value = ''; updateGutter(); codeEl.focus(); sysMsg('Редактор очищен.'); });
    $('sb-term-clear').addEventListener('click', function () { term.innerHTML = ''; sysMsg('Терминал очищен.'); });
    $('sb-tmpl-btn').addEventListener('click', function () { applyTemplate(); });

    /* ==== ⌨️ Панель быстрых символов (вставка в позицию курсора) ==== */
    function insertSym37(sym) {
      var text = sym === 'Tab' ? '    ' : sym;
      var s = codeEl.selectionStart || 0;
      var e = codeEl.selectionEnd || 0;
      codeEl.value = codeEl.value.slice(0, s) + text + codeEl.value.slice(e);
      codeEl.selectionStart = codeEl.selectionEnd = s + text.length;
      codeEl.focus();
      updateGutter();
    }
    (function () {
      var symPanel = $('sb-syms');
      if (!symPanel) return;
      symPanel.addEventListener('mousedown', function (e) { e.preventDefault(); });
      symPanel.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-sym]');
        if (b) insertSym37(b.getAttribute('data-sym'));
      });
    })();

    /* ==== 💾 Мои сохранённые программы (100% локально, только localStorage) ==== */
    var PROG_KEY = 'l37_sandbox_programs';
    var LANG_LABEL = { python: 'Python 3', cpp: 'C++17', js: 'JavaScript' };
    function loadProgs37() {
      try { var v = JSON.parse(localStorage.getItem(PROG_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
    }
    function storeProgs37(arr) {
      try { localStorage.setItem(PROG_KEY, JSON.stringify(arr.slice(-50))); } catch (e) { errMsg('Не удалось сохранить: хранилище браузера недоступно.'); }
    }
    function renderProgs37() {
      var box = $('sb-prog-list');
      if (!box) return;
      var arr = loadProgs37();
      if (!arr.length) { box.innerHTML = '<p class="sb-progs-empty">Пока пусто — напиши код и нажми «💾 Сохранить».</p>'; return; }
      box.innerHTML = arr.slice().reverse().map(function (p) {
        return '<div class="sb-prog-item">' +
          '<div class="sb-prog-meta"><b>' + escHtml(p.name) + '</b><small>' + escHtml(LANG_LABEL[p.lang] || p.lang) + ' · ' + new Date(p.ts).toLocaleString('ru-RU') + '</small></div>' +
          '<div class="sb-prog-actions">' +
          '<button type="button" class="sb-mini" data-prog-load="' + escHtml(p.id) + '">📂 Загрузить</button>' +
          '<button type="button" class="sb-mini" data-prog-del="' + escHtml(p.id) + '">🗑️</button>' +
          '</div></div>';
      }).join('');
      Array.prototype.forEach.call(box.querySelectorAll('[data-prog-load]'), function (b) {
        b.addEventListener('click', function () { loadProg37(b.getAttribute('data-prog-load')); });
      });
      Array.prototype.forEach.call(box.querySelectorAll('[data-prog-del]'), function (b) {
        b.addEventListener('click', function () {
          var pid = b.getAttribute('data-prog-del');
          storeProgs37(loadProgs37().filter(function (p) { return p.id !== pid; }));
          renderProgs37();
          sysMsg('🗑️ Программа удалена из локального хранилища.');
        });
      });
    }
    function loadProg37(id) {
      var p = loadProgs37().filter(function (x) { return x.id === id; })[0];
      if (!p) return;
      state.lang = (p.lang in TEMPLATES) ? p.lang : 'python';
      state.tmpl = 0;
      Array.prototype.forEach.call(document.querySelectorAll('.sb-lang-tab'), function (t2) {
        t2.classList.toggle('active', t2.getAttribute('data-lang') === state.lang);
      });
      rebuildTmplChips();
      syncFileBadge37();
      syncPyBtn();
      codeEl.value = p.code;
      updateGutter();
      closeProgs37();
      sysMsg('📂 Загружена программа: ' + p.name + ' (' + LANG_LABEL[state.lang] + ')');
    }
    function openProgs37() {
      renderProgs37();
      $('sb-progs-modal').style.display = 'flex';
      var inp = $('sb-prog-name');
      if (inp) { inp.value = ''; setTimeout(function () { try { inp.focus(); } catch (e) {} }, 60); }
    }
    function closeProgs37() { $('sb-progs-modal').style.display = 'none'; }
    $('sb-progs').addEventListener('click', openProgs37);
    $('sb-save').addEventListener('click', openProgs37);
    $('sb-progs-close').addEventListener('click', closeProgs37);
    $('sb-progs-modal').addEventListener('click', function (e) { if (e.target === this) closeProgs37(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeProgs37(); });
    $('sb-prog-save').addEventListener('click', function () {
      var code = codeEl.value;
      if (!code.trim()) { errMsg('⚠️ Редактор пуст — нечего сохранять.'); return; }
      var name = ($('sb-prog-name').value || '').trim() || ('Программа · ' + new Date().toLocaleDateString('ru-RU'));
      var arr = loadProgs37();
      arr.push({ id: 'pr' + Date.now().toString(36), name: name, lang: state.lang, code: code, ts: Date.now() });
      storeProgs37(arr);
      $('sb-prog-name').value = '';
      renderProgs37();
      okMsg('💾 Сохранено локально в этом браузере: ' + name);
    });
    $('sb-copy').addEventListener('click', function () {
      function fallback() {
        codeEl.select();
        try { document.execCommand('copy'); okMsg('📋 Код скопирован.'); } catch (e) { errMsg('Не удалось скопировать.'); }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(codeEl.value).then(function () { okMsg('📋 Код скопирован в буфер обмена.'); }, fallback);
      } else fallback();
    });
    $('sb-back').addEventListener('click', function () {
      try { if (history.length > 1) { history.back(); return; } } catch (e) {}
    });
    codeEl.addEventListener('input', updateGutter);
    codeEl.addEventListener('scroll', function () { gutter.scrollTop = codeEl.scrollTop; });
    codeEl.addEventListener('keydown', function (e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        var s = codeEl.selectionStart, en = codeEl.selectionEnd;
        codeEl.value = codeEl.value.slice(0, s) + '    ' + codeEl.value.slice(en);
        codeEl.selectionStart = codeEl.selectionEnd = s + 4;
        updateGutter();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
    });

    /* ==== 🪄 Умный авто-помощник ввода (100% локально) ==== */
    var PAIRS37 = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" };
    function insertPair37(open, close) {
      var s = codeEl.selectionStart || 0, en = codeEl.selectionEnd || 0;
      var inner = codeEl.value.slice(s, en);
      codeEl.value = codeEl.value.slice(0, s) + open + inner + close + codeEl.value.slice(en);
      codeEl.selectionStart = s + 1;
      codeEl.selectionEnd = s + 1 + inner.length;
      codeEl.focus();
      updateGutter();
      syncAutoChips37();
    }
    function smartEnter37() {
      var s = codeEl.selectionStart || 0, en = codeEl.selectionEnd || 0;
      var before = codeEl.value.slice(0, s);
      var lineStart = before.lastIndexOf('\n') + 1;
      var curLine = before.slice(lineStart);
      var indent = (curLine.match(/^[ \t]*/) || [''])[0];
      var trimmed = curLine.trim();
      var extra = '';
      if (state.lang === 'python' && /:$/.test(trimmed)) extra = '    ';
      if (state.lang !== 'python' && /\{\s*$/.test(trimmed)) extra = '    ';
      var ins = '\n' + indent + extra;
      codeEl.value = before + ins + codeEl.value.slice(en);
      codeEl.selectionStart = codeEl.selectionEnd = s + ins.length;
      updateGutter();
      syncAutoChips37();
    }
    codeEl.addEventListener('keydown', function (e) {
      if (PAIRS37[e.key]) { e.preventDefault(); insertPair37(e.key, PAIRS37[e.key]); return; }
      if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && !e.shiftKey) { e.preventDefault(); smartEnter37(); return; }
      if (e.key === ')' || e.key === ']' || e.key === '}' || e.key === '"' || e.key === "'") {
        var s = codeEl.selectionStart || 0;
        if (s === codeEl.selectionEnd && codeEl.value.charAt(s) === e.key) {
          e.preventDefault();
          codeEl.selectionStart = codeEl.selectionEnd = s + 1;
          syncAutoChips37();
        }
      }
    });
    var AUTOCMDS37 = {
      python: ['print()', 'input()', 'for i in range():', 'def ', 'len()', 'range()', 'import ', 'while '],
      cpp: ['std::cout << ', 'std::cin >> ', 'int main()', '#include ', 'std::vector<int> ', 'using namespace std;', 'return 0;'],
      js: ['console.log()', 'function ', 'const ', 'let ', 'document.querySelector()', 'Math.max()']
    };
    function syncAutoChips37() {
      var box = $('sb-autochips');
      if (!box) return;
      var before = codeEl.value.slice(0, codeEl.selectionStart || 0);
      var m = before.match(/[A-Za-z_:#.][A-Za-z0-9_:#.]*$/);
      var token = m ? m[0].toLowerCase() : '';
      var list = AUTOCMDS37[state.lang] || [];
      var hits = [];
      if (token) {
        for (var i = 0; i < list.length && hits.length < 3; i++) {
          if (list[i].toLowerCase().indexOf(token) === 0 && list[i].toLowerCase() !== token) hits.push(list[i]);
        }
      }
      if (!hits.length) hits = list.slice(0, 3);
      box.innerHTML = hits.map(function (c) {
        return '<button type="button" class="sb-chip" data-cmd="' + escHtml(c) + '">' + escHtml(c) + '</button>';
      }).join('');
      Array.prototype.forEach.call(box.querySelectorAll('[data-cmd]'), function (b) {
        b.addEventListener('click', function () { insertCmd37(b.getAttribute('data-cmd')); });
      });
    }
    function insertCmd37(cmd) {
      var s = codeEl.selectionStart || 0, en = codeEl.selectionEnd || 0;
      var before = codeEl.value.slice(0, s);
      var m = before.match(/[A-Za-z_:#.][A-Za-z0-9_:#.]*$/);
      var start = m ? s - m[0].length : s;
      codeEl.value = codeEl.value.slice(0, start) + cmd + codeEl.value.slice(en);
      var pos = start + cmd.length;
      if (/\(\)$/.test(cmd)) pos = start + cmd.length - 1;
      codeEl.selectionStart = codeEl.selectionEnd = pos;
      codeEl.focus();
      updateGutter();
      syncAutoChips37();
    }
    codeEl.addEventListener('input', syncAutoChips37);
    Array.prototype.forEach.call(document.querySelectorAll('.sb-lang-tab'), function (tab) {
      tab.addEventListener('click', syncAutoChips37);
    });
    syncAutoChips37();

    Array.prototype.forEach.call(document.querySelectorAll('.sb-lang-tab'), function (tab) {
      tab.addEventListener('click', function () {
        Array.prototype.forEach.call(document.querySelectorAll('.sb-lang-tab'), function (t2) { t2.classList.remove('active'); });
        tab.classList.add('active');
        state.lang = tab.getAttribute('data-lang');
        state.tmpl = 0;
        rebuildTmplChips();
        applyTemplate();
      });
    });

    function rebuildTmplChips() {
      var box = $('sb-tmpls');
      var names = TEMPLATES[state.lang].map(function (t) { return t.name; });
      var html = '<span class="lbl">Шаблоны:</span>';
      names.forEach(function (nm, i) {
        html += '<button type="button" class="sb-tmpl' + (i === state.tmpl ? ' active' : '') + '" data-tmpl="' + i + '">' + escHtml(nm) + '</button>';
      });
      box.innerHTML = html;
      Array.prototype.forEach.call(box.querySelectorAll('.sb-tmpl'), function (chip) {
        chip.addEventListener('click', function () {
          state.tmpl = parseInt(chip.getAttribute('data-tmpl'), 10) || 0;
          Array.prototype.forEach.call(box.querySelectorAll('.sb-tmpl'), function (c2) { c2.classList.remove('active'); });
          chip.classList.add('active');
          applyTemplate();
        });
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll('#sb-tmpls .sb-tmpl'), function (chip) {
      chip.addEventListener('click', function () {
        state.tmpl = parseInt(chip.getAttribute('data-tmpl'), 10) || 0;
        Array.prototype.forEach.call(document.querySelectorAll('#sb-tmpls .sb-tmpl'), function (c2) { c2.classList.remove('active'); });
        chip.classList.add('active');
        applyTemplate();
      });
    });

    window.__l37sandbox37 = {
      state: state,
      templates: TEMPLATES,
      run: run,
      applyTemplate: applyTemplate,
      rebuildTmplChips: rebuildTmplChips,
      lines: function () { return term.children.length; },
      termText: function () { return term.textContent; },
      code: function () { return codeEl.value; },
      programs: loadProgs37,
      openProgs: openProgs37,
      theme37: function () { return document.body.classList.contains('sb-day') ? 'day' : 'night'; }
    };

    sysMsg('💻 Код-песочница Лицеиста готова. Выбери язык, шаблон — и жми «▶️ Запустить» (или Ctrl+Enter).');
    applyTemplate();
  })();
</script>
</body>
</html>
