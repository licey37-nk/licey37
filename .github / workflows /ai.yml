name: AI Bot
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  run-ai:
    if: github.actor == 'radis8853038-tech' && !contains(github.event.comment.body, '🤖 Автопилот')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run AI
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          ISSUE_BODY: ${{ github.event.comment.body || github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request, re

          prompt = f"""Ты Senior-разработчик репозитория Лицея №37. Выполни задачу пользователя максимально подробно и без сокращений.
          Задача: {os.environ['ISSUE_TITLE']}
          Детали: {os.environ['ISSUE_BODY']}
          
          Верни СТРОГО валидный JSON без markdown-обёртки в формате:
          {{"reply": "Подробный отчёт на русском языке, какие папки и файлы созданы или обновлены", "files": [{{"path": "путь/файл.txt", "content": "полное содержимое файла без сокращений"}}]}}
          Ты можешь создавать любые папки (например knowledge/b2.txt) и полностью обновлять index.html."""

          req = urllib.request.Request(
              os.environ["AI_API_URL"],
              data=json.dumps({
                  "model": "deepseek/deepseek-chat",
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0.3,
                  "max_tokens": 16000
              }).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['AI_API_KEY']}",
                  "Content-Type": "application/json"
              }
          )
          res = json.loads(urllib.request.urlopen(req).read().decode("utf-8"))
          raw = res["choices"]["message"]["content"].strip()
          raw = re.sub(r"^```json\s*|\s*```$", "", raw)
          data = json.loads(raw)

          for f in data.get("files", []):
              p = f["path"].lstrip("/")
              if os.path.dirname(p):
                  os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8") as out:
                  out.write(f["content"])

          with open("ai_reply.txt", "w", encoding="utf-8") as r:
              r.write("🤖 Автопилот выполнил задачу:\n\n" + data.get("reply", "Готово!"))
          EOF
          git config user.name "AI Bot"
          git config user.email "bot@licey37.ru"
          git add -A
          git commit -m "AI update" || exit 0
          git push
          gh issue comment "$ISSUE_NUM" --body-file ai_reply.txt
