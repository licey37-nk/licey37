name: AI Bot on Issue

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  ai-process:
    runs-on: ubuntu-latest
    if: |
      github.actor == 'radis8853038-tech' &&
      !startsWith(github.event.comment.body || github.event.issue.body || '', '🤖') &&
      !startsWith(github.event.comment.body || github.event.issue.body || '', '⚠️') &&
      !startsWith(github.event.comment.body || github.event.issue.body || '', '❌')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run bot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          ISSUE_BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: python3 .github/bot.py

      - name: Post report as comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f r.txt ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file r.txt
            rm r.txt
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "🤖 AI: автоматическое создание файлов по запросу"
            git push
          fi
