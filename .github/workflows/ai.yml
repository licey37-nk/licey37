name: AI Code Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  process-issue:
    if: |
      github.actor == 'radis8853038-tech' && 
      !startsWith(github.event.issue.title, '🤖') && 
      !startsWith(github.event.issue.title, '⚠️') &&
      !startsWith(github.event.comment.body, '🤖') &&
      !startsWith(github.event.comment.body, '⚠️')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run AI Bot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: python3 .github/bot.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "🤖 AI Auto-commit for issue #${{ github.event.issue.number }}"
          git push

      - name: Post Comment and Cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f r.txt ]; then
            gh issue comment ${{ github.event.issue.number }} --body-file r.txt
            rm r.txt
          else
            echo "Файл r.txt не найден. Возможно, произошла ошибка до его создания."
          fi
