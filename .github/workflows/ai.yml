name: AI Bot
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  run:
    if: github.actor == 'radis8853038-tech' && !contains(github.event.comment.body, '🤖')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          K: ${{ secrets.AI_API_KEY }}
          U: ${{ secrets.AI_API_URL }}
          T: ${{ github.event.issue.title }}
          B: ${{ github.event.comment.body || github.event.issue.body }}
          N: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c 'import os,json,urllib.request;p="Ты разработчик сайта Лицея 37. Задача: "+os.environ["T"]+"\n"+os.environ["B"]+"\nВерни СТРОГО JSON без лишнего текста: {\"reply\":\"отчет на русском\",\"files\":[{\"path\":\"путь/файл.txt\",\"content\":\"полное содержимое\"}]}";req=urllib.request.Request(os.environ["U"],data=json.dumps({"model":"openai/gpt-4o-mini","response_format":{"type":"json_object"},"messages":[{"role":"user","content":p}]}).encode(),headers={"Authorization":"Bearer "+os.environ["K"],"Content-Type":"application/json","User-Agent":"Mozilla/5.0"});txt=urllib.request.urlopen(req).read().decode();print("RAW:",txt[:300]);raw=json.loads(txt)["choices"]["message"]["content"];d=json.loads(raw[raw.find("{"):raw.rfind("}")+1]);[os.makedirs(os.path.dirname(f["path"].lstrip("/")),exist_ok=True) if os.path.dirname(f["path"].lstrip("/")) else None for f in d.get("files",[])];[open(f["path"].lstrip("/"),"w",encoding="utf-8").write(f["content"]) for f in d.get("files",[])];open("r.txt","w",encoding="utf-8").write("🤖 "+d.get("reply","Готово!"))'
          git config user.name "AI Bot"
          git config user.email "bot@licey37.ru"
          git add -A
          git commit -m "AI update" || exit 0
          git push
          gh issue comment "$N" --body-file r.txt
